name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Check formatting
        run: cargo fmt --check

      - name: Lint all targets
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Run Rust unit tests
        run: cargo test --locked

      - name: Build release binary
        run: cargo build --release --locked

      - name: Install Python test dependencies
        run: pip install Pillow

      - name: Smoke test (carve JPEG + PNG from synthetic image)
        run: |
          python3 - <<'EOF'
          from PIL import Image
          import random, os

          os.makedirs("/tmp/pala-ci", exist_ok=True)
          img = Image.new("RGB", (64, 64), (100, 150, 200))
          img.save("/tmp/pala-ci/orig.png")
          img.save("/tmp/pala-ci/orig.jpg")

          with open("/tmp/pala-ci/orig.png", "rb") as f: png = f.read()
          with open("/tmp/pala-ci/orig.jpg", "rb") as f: jpg = f.read()
          noise = bytes([random.randint(0, 255) for _ in range(512 * 1024)])
          with open("/tmp/pala-ci/raw.img", "wb") as f:
              f.write(noise)
              f.write(png)
              f.write(b"\x00" * 256)
              f.write(jpg)
          EOF
          rm -rf /tmp/pala-ci/out
          target/release/pala /tmp/pala-ci/raw.img /tmp/pala-ci/out/ -t jpeg,png

      - name: Verify exact SHA-256 match
        run: |
          python3 - <<'EOF'
          import hashlib, sys

          def sha(path):
              return hashlib.sha256(open(path, "rb").read()).hexdigest()

          expected = {
              "png": sha("/tmp/pala-ci/orig.png"),
              "jpg": sha("/tmp/pala-ci/orig.jpg"),
          }
          actual = {
              "png": sha("/tmp/pala-ci/out/png_0001.png"),
              "jpg": sha("/tmp/pala-ci/out/jpg_0001.jpg"),
          }
          if expected != actual:
              print(f"SHA-256 mismatch: expected={expected}, actual={actual}")
              sys.exit(1)
          print("SHA-256 match: PASS")
          EOF

      - name: Full integration suite
        run: python3 tests/test_pala.py

      - name: Binary size check (must be under 2 MiB)
        run: |
          SIZE=$(stat -c%s target/release/pala)
          echo "pala binary: ${SIZE} bytes"
          [ "$SIZE" -lt 2097152 ] || (echo "FAIL: binary exceeds 2 MiB" && exit 1)

  windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --check

      - name: Lint all targets
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Run Rust unit tests
        run: cargo test --locked

      - name: Build release binary
        run: cargo build --release --locked

  dependency-audit:
    runs-on: ubuntu-latest
    permissions:
      checks: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Audit locked dependencies
        uses: rustsec/audit-check@v2
        with:
          token: ${{ github.token }}
